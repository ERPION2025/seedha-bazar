services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: seedha
      POSTGRES_USER: seedha
      POSTGRES_PASSWORD: seedha
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      DB_NAME: seedha
      DB_USER: seedha
      DB_PASSWORD: seedha
    depends_on: [db]
    ports: ["8000:8000"]
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
  worker:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      DB_NAME: seedha
      DB_USER: seedha
      DB_PASSWORD: seedha
    depends_on: [db, api]
    # Refreshes mandi rates about every 24 hours, then sends daily rate alerts.
    command: python manage.py run_worker
volumes:
  pgdata:
