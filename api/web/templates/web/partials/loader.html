{% load web_tags %}{# Loaders: small farming scenes shown while a page or form takes a moment. Drawn by hand as plain shapes, earthy colours, gentle motion. #}
<div class="ld" id="sb-loader" hidden role="status" aria-live="polite">
  <div class="ld-art" aria-hidden="true"></div>
  <p class="ld-text">{% t "One moment…" %}</p>
  <p class="ld-slow" hidden>{% t "Still loading. The network seems slow." %} <button type="button" class="link-btn" data-ld-close>{% t "Hide" %}</button></p>
</div>
